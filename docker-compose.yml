services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentready
      POSTGRES_PASSWORD: agentready
      POSTGRES_DB: agentready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentready"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
